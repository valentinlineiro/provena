name: Market Sync

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx packages/market-postgres/src/sync-market.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

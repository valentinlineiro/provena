name: Deploy Provena Web

on:
  push:
    branches: [main]
    paths:
      - 'packages/provena-web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: packages/provena-web
      - name: Inject KV namespace ID
        run: |
          if [ -n "${{ secrets.PROVENA_KV_ID }}" ]; then
            sed -i "s/TODO/${{ secrets.PROVENA_KV_ID }}/" wrangler.jsonc
          fi
        working-directory: packages/provena-web
      - run: npx wrangler deploy
        working-directory: packages/provena-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
